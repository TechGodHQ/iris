[workspace]
resolver = "2"
members = [
    "crates/iris-core",
    "crates/iris-storage",
    "crates/iris-providers",
    "crates/iris-server",
    "crates/iris-cli",
    "crates/iris-mcp",
    "crates/iris-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TechGodHQ/iris"
homepage = "https://github.com/TechGodHQ/iris"
description = "LLM-first, source-agnostic messaging system"
authors = ["TechGodHQ"]

[workspace.lints.rust]
unsafe_code = "forbid"
# Tighten missing_docs once the API surface stabilizes
# missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"
toml = "0.8"

# Testing
pretty_assertions = "1"
